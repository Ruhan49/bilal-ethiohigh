    <!-- Main Dynamic View Container -->

    <!-- Replaced standard alert with custom clean modal -->

        // --- CORE UI CONTROLLER & VIEW ROUTER ---
        function switchView(view) {
            state.currentView = view;
            
            // Update nav buttons
            const studentBtn = document.getElementById('navStudentBtn');
            const directorBtn = document.getElementById('navDirectorBtn');
            
            if (view === 'student') {
                studentBtn.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-white text-indigo-700 shadow transition flex items-center space-x-1.5";
                directorBtn.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-white/10 hover:bg-white/20 text-indigo-100 transition flex items-center space-x-1.5";
                renderStudentPortal();
            } else if (view === 'director') {
                directorBtn.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-white text-indigo-700 shadow transition flex items-center space-x-1.5";
                studentBtn.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-white/10 hover:bg-white/20 text-indigo-100 transition flex items-center space-x-1.5";
                renderDirectorPortal();
            } else {
                studentBtn.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-indigo-800 text-white hover:bg-indigo-900 transition flex items-center space-x-1.5";
                directorBtn.className = "px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg bg-white/10 hover:bg-white/20 text-indigo-100 transition flex items-center space-x-1.5";
                renderHome();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- CUSTOM MODAL HELPER ---
        function showModal(title, message, isSuccess = true) {
            const modal = document.getElementById('customModal');
            const box = document.getElementById('modalBox');
            const titleEl = document.getElementById('modalTitle');
            const msgEl = document.getElementById('modalMessage');
            const iconEl = document.getElementById('modalIcon');

            titleEl.innerText = title;
            msgEl.innerText = message;
            
            if (isSuccess) {
                iconEl.className = "w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl mb-4 mx-auto";
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            } else {
                iconEl.className = "w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-xl mb-4 mx-auto";
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const box = document.getElementById('modalBox');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // --- RENDER LANDING / HOME VIEW ---

                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
                            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl font-bold mb-4">

        // --- STUDENT PORTAL CONTROLLER ---
        function renderStudentPortal() {

            state.studentTab = tab;

                                        <input type="text" id="regPaymentRef" required placeholder="e.g. TXN48920194" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 text-sm">
                                        <p class="text-[11px] text-slate-500 mt-1">Official Merchant: <b>882194 (EthioHigh)</b> - Fee: 250 ETB</p>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-indigo-200 transition flex items-center justify-center space-x-2 text-base">
                                <i class="fa-solid fa-paper-plane"></i>
                                <span>Submit Remote Registration Application</span>
                            </button>
                        </form>
                    </div>
                `;
            } else if (state.studentTab === 'status') {
                return `
                    <div class="space-y-6">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8">
                            <h3 class="text-xl font-bold text-slate-900 mb-2">My Application & Enrollment Status</h3>
                            <p class="text-sm text-slate-500 mb-6">Track your document verification, director approval, and digital receipt in real time.</p>
                            
                            <div class="space-y-4">
                                ${state.applications.map(app => `
                                    <div class="bg-slate-50 rounded-2xl p-6 border border-slate-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                        <div class="space-y-1">
                                            <div class="flex items-center space-x-2">
                                                <span class="font-bold text-slate-900 text-base">${app.fullName}</span>
                                                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${app.status === 'Approved' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                                    ${app.status === 'Approved' ? '🟢 Approved & Enrolled' : '🟡 Pending Review'}
                                                </span>
                                            </div>
                                            <p class="text-xs text-slate-600">Application ID: <b>${app.id}</b> • Applying For: <b>${app.gradeApplying}</b> ${app.stream !== 'N/A' ? '• Stream: ' + app.stream : ''}</p>
                                            <p class="text-xs text-slate-500">Assigned Class: <span class="font-semibold text-indigo-600">${app.assignedClass}</span> • Payment: <span class="font-semibold text-emerald-600">${app.paymentStatus} (${app.paymentRef})</span></p>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            ${app.status === 'Approved' ? `
                                                <button onclick="downloadReceipt('${app.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow transition flex items-center space-x-1.5">
                                                    <i class="fa-solid fa-download"></i>
                                                    <span>Download Digital Receipt</span>
                                                </button>
                                            ` : `
                                                <span class="text-xs text-amber-600 bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-200 font-medium">Awaiting Director Verification</span>
                                            `}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.studentTab === 'announcements') {
                return `
                    <div class="space-y-6">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8">
                            <h3 class="text-xl font-bold text-slate-900 mb-2">📢 Official School Announcements</h3>
                            <p class="text-sm text-slate-500 mb-6">Important updates published directly by the school director.</p>
                            
                            <div class="space-y-4">
                                ${state.announcements.map(ann => `
                                    <div class="p-5 bg-indigo-50/50 border border-indigo-100 rounded-2xl relative">
                                        <div class="flex items-center justify-between mb-2">
                                            <h4 class="font-bold text-slate-900 text-base">${ann.title}</h4>
                                            <span class="text-xs font-semibold text-indigo-600 bg-white px-2.5 py-1 rounded-lg border border-indigo-100">${ann.date}</span>
                                        </div>
                                        <p class="text-sm text-slate-600 leading-relaxed">${ann.content}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8 max-w-xl mx-auto">
                        <div class="text-center mb-6">
                            <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">
                                🎓
                            </div>
                            <h3 class="text-xl font-bold text-slate-900">Student Digital Profile</h3>
                            <p class="text-xs text-slate-500">Verified Remote Student Account</p>
                        </div>
                        <div class="space-y-3 text-sm">
                            <div class="flex justify-between p-3 bg-slate-50 rounded-xl">
                                <span class="text-slate-500">Full Name</span>
                                <span class="font-semibold text-slate-900">Abebe Kebede</span>
                            </div>
                            <div class="flex justify-between p-3 bg-slate-50 rounded-xl">
                                <span class="text-slate-500">Student ID</span>
                                <span class="font-semibold text-indigo-600">ETH-2026-8841</span>
                            </div>
                            <div class="flex justify-between p-3 bg-slate-50 rounded-xl">
                                <span class="text-slate-500">Enrolled Grade & Class</span>
                                <span class="font-semibold text-slate-900">Grade 9A (Assigned)</span>
                            </div>
                            <div class="flex justify-between p-3 bg-slate-50 rounded-xl">
                                <span class="text-slate-500">Phone Number</span>
                                <span class="font-semibold text-slate-900">+251 911 223 344</span>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function toggleStreamField() {
            const grade = document.getElementById('regGradeApplying').value;
            const streamSec = document.getElementById('streamSection');
            if (grade === 'Grade 11' || grade === 'Grade 12') {
                streamSec.classList.remove('hidden');
            } else {
                streamSec.classList.add('hidden');
            }
        }

        function handleStudentSubmit(e) {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value;
            const dob = document.getElementById('regDob').value;
            const gender = document.getElementById('regGender').value;
            const parentName = document.getElementById('regParentName').value;
            const phone = document.getElementById('regPhone').value;
            const address = document.getElementById('regAddress').value;
            const previousSchool = document.getElementById('regPreviousSchool').value;
            const gradeApplying = document.getElementById('regGradeApplying').value;
            const fileInput = document.getElementById('regDocFile');
            const paymentRef = document.getElementById('regPaymentRef').value;
            
            let stream = 'N/A';
            if (gradeApplying === 'Grade 11' || gradeApplying === 'Grade 12') {
                const radios = document.getElementsByName('streamChoice');
                for (let r of radios) {
                    if (r.checked) stream = r.value;
                }
            }

            // Automatic class assignment logic with 45-student limit check
            let assignedClass = 'Grade 9B';
            if (gradeApplying === 'Grade 9') {
                assignedClass = state.classesData['Grade 9A'].full ? 'Grade 9B' : 'Grade 9A';
            } else if (gradeApplying === 'Grade 10') {
                assignedClass = state.classesData['Grade 10A'].full ? 'Grade 10B' : 'Grade 10A';
            } else if (gradeApplying === 'Grade 11') {
                assignedClass = stream === 'Natural Science' ? 'Grade 11 Nat A' : 'Grade 11 Soc A';
            } else if (gradeApplying === 'Grade 12') {
                assignedClass = stream === 'Natural Science' ? 'Grade 12 Nat A' : 'Grade 12 Soc A';
            }

            const newApp = {
                id: 'APP-' + Math.floor(1000 + Math.random() * 9000),
                fullName,
                dob,
                gender,
                parentName,
                phone,
                address,
                previousSchool,
                gradeApplying,
                stream,
                docUploaded: true,
                docName: fileInput.files[0] ? fileInput.files[0].name : 'document.pdf',
                paymentStatus: 'Confirmed',
                paymentRef,
                status: 'Pending',
                assignedClass,
                submissionDate: new Date().toISOString().split('T')[0]
            };

            state.applications.unshift(newApp);
            showModal('Registration Submitted!', `Your application has been received successfully and assigned to ${assignedClass}. Awaiting Director approval and document review.`);
            state.studentTab = 'status';
            renderStudentPortal();
        }

        function downloadReceipt(appId) {
            const app = state.applications.find(a => a.id === appId);
            if (!app) return;
            showModal('Digital Receipt Downloaded', `Official Enrollment & Payment Receipt for ${app.fullName} (${app.assignedClass}) downloaded successfully as PDF.`);
        }

        // --- DIRECTOR / ADMIN PORTAL CONTROLLER ---
        function renderDirectorPortal() {
            const container = document.getElementById('appContainer');
            
            container.innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
                    <!-- Director Header Banner -->
                    <div class="bg-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-xl mb-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <div>
                            <span class="px-3 py-1 bg-indigo-500/30 text-indigo-300 text-xs font-semibold rounded-full border border-indigo-500/30">
                                👨‍💼 Director & Administrator Portal
                            </span>
                            <h2 class="text-2xl sm:text-3xl font-extrabold mt-2">EthioHigh Management Dashboard</h2>
                            <p class="text-xs sm:text-sm text-slate-400">Review remote applications, verify payments, manage 45-student capacities, and publish announcements.</p>
                        </div>
                        <div class="flex items-center space-x-3 bg-slate-800 p-3 rounded-2xl border border-slate-700">
                            <div class="text-right">
                                <p class="text-xs text-slate-400">School Subscription</p>
                                <p class="text-sm font-bold text-emerald-400">500 ETB Active</p>
                            </div>
                            <div class="w-10 h-10 bg-emerald-500/20 text-emerald-400 rounded-xl flex items-center justify-center font-bold">
                                ✓
                            </div>
                        </div>
                    </div>

                    <!-- Director Navigation Tabs -->
                    <div class="flex overflow-x-auto hide-scrollbar space-x-2 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200 mb-6">
                        <button onclick="setDirectorTab('dashboard')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap transition flex items-center space-x-2 ${state.directorTab === 'dashboard' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
                            <i class="fa-solid fa-chart-pie"></i>
                            <span>Overview Analytics</span>
                        </button>
                        <button onclick="setDirectorTab('applications')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap transition flex items-center space-x-2 ${state.directorTab === 'applications' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
                            <i class="fa-solid fa-file-shield"></i>
                            <span>Applications Review</span>
                        </button>
                        <button onclick="setDirectorTab('classes')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap transition flex items-center space-x-2 ${state.directorTab === 'classes' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
                            <i class="fa-solid fa-users-rectangle"></i>
                            <span>Classes & 45-Limit</span>
                        </button>
                        <button onclick="setDirectorTab('announcements')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap transition flex items-center space-x-2 ${state.directorTab === 'announcements' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
                            <i class="fa-solid fa-bullhorn"></i>
                            <span>Announcements</span>
                        </button>
                    </div>

                    <!-- Director Dynamic Content Area -->
                    <div id="directorContentArea">
                        ${getDirectorTabContent()}
                    </div>
                </div>
            `;
        }

        function setDirectorTab(tab) {
            state.directorTab = tab;
            renderDirectorPortal();
        }

        function getDirectorTabContent() {
            if (state.directorTab === 'dashboard') {
                return `
                    <div class="space-y-6">
                        <!-- Stats Grid -->
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <p class="text-xs font-bold text-slate-400 uppercase mb-1">Total Applications</p>
                                <p class="text-3xl font-extrabold text-slate-900">${state.applications.length}</p>
                                <span class="text-xs text-indigo-600 font-semibold mt-2 inline-block">Active remote queue</span>
                            </div>
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <p class="text-xs font-bold text-slate-400 uppercase mb-1">Approved Enrolled</p>
                                <p class="text-3xl font-extrabold text-emerald-600">${state.applications.filter(a => a.status === 'Approved').length}</p>
                                <span class="text-xs text-emerald-600 font-semibold mt-2 inline-block">🟢 Verified & Cleared</span>
                            </div>
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <p class="text-xs font-bold text-slate-400 uppercase mb-1">Pending Review</p>
                                <p class="text-3xl font-extrabold text-amber-600">${state.applications.filter(a => a.status === 'Pending').length}</p>
                                <span class="text-xs text-amber-600 font-semibold mt-2 inline-block">🟡 Requires action</span>
                            </div>
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <p class="text-xs font-bold text-slate-400 uppercase mb-1">School Subscription</p>
                                <p class="text-3xl font-extrabold text-indigo-600">500 ETB</p>
                                <span class="text-xs text-indigo-600 font-semibold mt-2 inline-block">Fully Paid License</span>
                            </div>
                        </div>

                        <!-- Class Enrollment Summary Cards -->
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8">
                            <h3 class="text-lg font-bold text-slate-900 mb-4">Class Capacity & Stream Distribution (Max 45/Class)</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                ${Object.entries(state.classesData).map(([clsName, info]) => `
                                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                                        <div class="flex justify-between items-center">
                                            <span class="font-bold text-slate-900 text-sm">${clsName}</span>
                                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${info.full ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">
                                                ${info.full ? '🔴 FULL' : '🟢 ' + (info.capacity - info.enrolled) + ' seats'}
                                            </span>
                                        </div>
                                        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                            <div class="bg-indigo-600 h-full rounded-full" style="width: ${(info.enrolled / info.capacity) * 100}%"></div>
                                        </div>
                                        <p class="text-xs text-slate-500 text-right">${info.enrolled} / ${info.capacity} Enrolled</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.directorTab === 'applications') {
                return `
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8">
                        <h3 class="text-xl font-bold text-slate-900 mb-2">Student Application & Document Verification</h3>
                        <p class="text-sm text-slate-500 mb-6">Review uploaded student transcripts, verify Telebirr payment references, and approve or reject applications.</p>
                        
                        <div class="space-y-4">
                            ${state.applications.map(app => `
                                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                    <div class="space-y-1">
                                        <div class="flex items-center space-x-2">
                                            <span class="font-bold text-slate-900 text-base">${app.fullName}</span>
                                            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${app.status === 'Approved' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                                ${app.status}
                                            </span>
                                        </div>
                                        <p class="text-xs text-slate-600">ID: <b>${app.id}</b> • Grade: <b>${app.gradeApplying}</b> ${app.stream !== 'N/A' ? '• ' + app.stream : ''} • Prev School: ${app.previousSchool}</p>
                                        <p class="text-xs text-slate-500">Document: <span class="font-semibold text-indigo-600 underline cursor-pointer" onclick="showModal('Document Preview', 'Viewing official uploaded file: ${app.docName}')">${app.docName}</span> • Payment Ref: <span class="font-semibold text-emerald-600">${app.paymentRef}</span></p>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        ${app.status === 'Pending' ? `
                                            <button onclick="approveApplication('${app.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow transition">
                                                <i class="fa-solid fa-check mr-1"></i> Approve
                                            </button>
                                            <button onclick="rejectApplication('${app.id}')" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow transition">
                                                <i class="fa-solid fa-xmark mr-1"></i> Reject
                                            </button>
                                        ` : `
                                            <span class="text-xs text-emerald-700 font-bold bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200">Verified & Assigned to ${app.assignedClass}</span>
                                        `}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (state.directorTab === 'classes') {
                return `
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8">
                        <h3 class="text-xl font-bold text-slate-900 mb-2">Class Capacity & Stream Management (Max 45)</h3>
                        <p class="text-sm text-slate-500 mb-6">Real-time breakdown of sections, automated rollover status, and grade progression.</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${Object.entries(state.classesData).map(([clsName, info]) => `
                                <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200 flex items-center justify-between">
                                    <div>
                                        <h4 class="font-bold text-slate-900 text-base">${clsName}</h4>
                                        <p class="text-xs text-slate-500">Capacity limit: 45 students max</p>
                                        <p class="text-xs font-semibold text-indigo-600 mt-1">${info.enrolled} Enrolled students</p>
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-xs font-bold ${info.full ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">
                                        ${info.full ? '🔴 FULL' : '🟢 ' + (info.capacity - info.enrolled) + ' available'}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8 max-w-2xl mx-auto">
                        <h3 class="text-xl font-bold text-slate-900 mb-2">Publish School Announcement</h3>
                        <p class="text-sm text-slate-500 mb-6">Announcements appear instantly on all students' mobile dashboards.</p>
                        
                        <form onsubmit="handleAnnouncementSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Announcement Title</label>
                                <input type="text" id="annTitle" required placeholder="e.g. Mid-term exam schedules" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Content / Notice</label>
                                <textarea id="annContent" required rows="4" placeholder="Write full announcement details here..." class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition">
                                <i class="fa-solid fa-bullhorn mr-1"></i> Publish Announcement Instantly
                            </button>
                        </form>
                    </div>
                `;
            }
        }

        function approveApplication(appId) {
            const app = state.applications.find(a => a.id === appId);
            if (app) {
                app.status = 'Approved';
                // Update class enrollment
                if (state.classesData[app.assignedClass]) {
                    state.classesData[app.assignedClass].enrolled += 1;
                    if (state.classesData[app.assignedClass].enrolled >= 45) {
                        state.classesData[app.assignedClass].full = true;
                    }
                }
                showModal('Application Approved!', `Student ${app.fullName} has been officially approved and enrolled into ${app.assignedClass}.`);
                renderDirectorPortal();
            }
        }

        function rejectApplication(appId) {
            const app = state.applications.find(a => a.id === appId);
            if (app) {
                app.status = 'Rejected';
                showModal('Application Rejected', `Application ${app.id} was marked incomplete or rejected.`, false);
                renderDirectorPortal();
            }
        }

        function handleAnnouncementSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('annTitle').value;
            const content = document.getElementById('annContent').value;
            
            state.announcements.unshift({
                id: Date.now(),
                title,
                content,
                date: 'Just now',
                priority: 'high'
            });

            showModal('Announcement Published!', 'The notice is now live on all student mobile dashboards.');
            document.getElementById('annTitle').value = '';
            document.getElementById('annContent').value = '';
        }

        // --- INITIALIZE ON LOAD ---
        window.onload = function() {
            renderHome();
        };
    </script>
</body>
</html>
